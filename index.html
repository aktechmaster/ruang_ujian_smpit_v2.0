<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian CBT - SMP IT Al-Kautsar</title>
    <link rel="icon" href="smpit.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <img src="smpit.png" alt="Logo SMP IT Al-Kautsar" class="logo" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
        
        <h1>Selamat Datang di Ruang Ujian<br>SMP IT Al-Kautsar Mukomuko</h1>
        <!-- Subtitle judul ujian dinamis dari CONFIG -->
        <p class="exam-title" style="text-align: center; font-weight: 600; color: #0284c7; margin-top: -10px; margin-bottom: 20px;"></p>

        <form id="loginForm">
            <div class="input-group">
                <label for="pilihKelas">Pilih Kelas</label>
                <div id="kelasContainer" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;"></div>
                <input type="hidden" id="pilihKelas" required>
            </div>

            <div class="input-group">
                <label for="pilihSiswa">Nama Siswa</label>
                <!-- Regex diperbarui agar mendukung nama dengan petik (') atau titik (.) -->
                <input type="text" id="pilihSiswa" list="listSiswa" placeholder="Ketik nama lengkap siswa..." autocomplete="off" oninput="this.value = this.value.replace(/[^a-zA-Z\s'.,]/g, '')" required>
                <datalist id="listSiswa"></datalist>
                <div id="loadingSiswa" class="loader">Memuat data siswa dari server...</div>
            </div>

            <div class="input-group">
                <label for="pilihMapel">Pilih Mata Pelajaran</label>
                <div id="mapelContainer" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;"></div>
                <input type="hidden" id="pilihMapel" required>
            </div>

            <div class="input-group">
                <label for="emailSiswa">Email Anda</label>
                <input type="email" id="emailSiswa" placeholder="contoh: siswa@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="tokenUjian">Token / Password Ujian</label>
                <div style="position: relative;">
                    <input type="password" id="tokenUjian" placeholder="Masukkan token yang diberikan pengawas" required style="padding-right: 45px;">
                    <span id="toggleToken" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none;">👁️</span>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit" disabled>Memuat Sistem...</button>
        </form>

        <div class="footer-credit">
            &copy; 2026 <span>Ruang Ujian SMP IT Al-Kautsar</span> <br>
            Designed & Developed by aktechmaster
        </div>
    </div>

    <!-- Modal Alert Custom -->
    <div id="exambroAlertModal" style="display: none; position: fixed; z-index: 999999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); justify-content: center; align-items: center;">
        <div style="background: #ffffff; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.3);">
            <h3 style="color: #0284c7; margin-bottom: 15px; font-weight: 600;">Notifikasi</h3>
            <p id="exambroAlertMessage" style="color: #475569; font-size: 0.95rem; line-height: 1.6; margin-bottom: 25px; white-space: pre-line;"></p>
            <button onclick="tutupExambroAlert()" style="width: 100%; padding: 13px; background: linear-gradient(135deg, #38bdf8, #8b5cf6); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);">Mengerti</button>
        </div>
    </div>

    <!-- Pemuatan Skrip dari Folder js/ -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
